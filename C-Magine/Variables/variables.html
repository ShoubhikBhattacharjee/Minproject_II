<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions in C</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            text-align: center;
        }

        /* Header Background */
        .header {
            background: linear-gradient(to bottom, #ff1744, #e91e63); /* Smooth red gradient */
            padding: 50px 0;
        }

        /* New "Functions in C" Main Heading */
        .main-heading {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3); /* Softer shadow */
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2); /* Slight dark overlay for better contrast */
            border-radius: 8px;
        }

        /* Cards Section */
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
        }

        /* Card Styles */
        .card {
            background: #fff;
            padding: 30px;
            width: 300px;
            height: 180px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-decoration: none; /* Removes default link underline */
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Icon Styling */
        .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        /* Text inside Cards */
        .card p {
            font-size: 1.4rem;
            font-weight: bold;
            color: #b71c1c;
            margin: 0;
        }

        /* Remove link styling */
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="main-heading">PROGRAMS</h1>
    </div>

    <div class="container">
        <!-- Clickable cards linking to different HTML files -->
        <a href="leap_year.html" target="_blank" class="card">
            <span class="icon">🗓️</span>
            <p>Leap Year</p>
        </a>

        <a href="palindrome.html".html" target="_blank" class="card">
            <span class="icon">🔡</span>
            <p>Palindrome String</p>
        </a>

        <a href="string.html" target="_blank" class="card">
          <span class="icon">📿</span>
          <p>String</p>
      </a>

      <a href="swap_numbers.html" target="_blank" class="card">
        <span class="icon">🔄</span>
        <p>Swap Two  Numbers</p>
      </a>

    </div>
    
</body>
</html>
