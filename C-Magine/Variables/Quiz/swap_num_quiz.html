    <script>
      const quizData = [
        {
          question:
            "What is the purpose of the 'temp' variable in the swapping process?",
          options: [
            "It stores the sum of two numbers",
            "It temporarily holds the value of one variable during the swap",
            "It is used to multiply two numbers",
            "It stores the final swapped value",
          ],
          correct: 1,
        },
        {
          question:
            "Which of the following is the correct sequence for swapping two numbers using a third variable?",
          options: [
            "a = temp; b = a; temp = b;",
            "temp = a; a = b; b = temp;",
            "a = b; b = temp; temp = a;",
            "b = a; a = temp; temp = b;",
          ],
          correct: 1,
        },
        {
          question:
            "What will happen if we forget to use the 'temp' variable and directly assign `a = b` first?",
          options: [
            "The values of `a` and `b` will be swapped correctly",
            "The value of `a` will be lost",
            "It will result in a compilation error",
            "It will create an infinite loop",
          ],
          correct: 1,
        },
        {
          question:
            "Which format specifier is used to print integer values in C?",
          options: ["%c", "%f", "%d", "%s"],
          correct: 2,
        },
        {
          question: "Which operator is used for assignment in C?",
          options: ["=", "==", "!=", "<-"],
          correct: 0,
        },
        {
          question:
            "What is the final value of `b` after swapping, if `a = 5` and `b = 10` initially?",
          options: ["10", "5", "0", "15"],
          correct: 1,
        },
        {
          question: "Why do we need a third variable to swap two numbers?",
          options: [
            "To prevent data loss during assignment",
            "To store the final swapped value",
            "To multiply both numbers",
            "To store their sum",
          ],
          correct: 0,
        },
        {
          question:
            "What will happen if we swap two variables without using a third variable?",
          options: [
            "It is not possible to swap without a third variable",
            "We can swap using arithmetic operations",
            "It will cause a segmentation fault",
            "The program will not compile",
          ],
          correct: 1,
        },
        {
          question:
            "Which C library function is used to display output on the screen?",
          options: ["scanf()", "printf()", "display()", "print()"],
          correct: 1,
        },
        {
          question:
            "Which data type is best suited for storing integer values like `a` and `b` in this program?",
          options: ["float", "char", "int", "double"],
          correct: 2,
        },
      ];

      document.addEventListener("DOMContentLoaded", () => {
        initializeQuiz(quizData);
      });
