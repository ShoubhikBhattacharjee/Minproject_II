<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Check with Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .sidebar {
      width: 250px;
      background-color: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      color: #facc15;
      text-align: center;
      margin-bottom: 20px;
    }

    .menu {
      list-style: none;
    }

    .menu-item {
      background-color: #334155;
      padding: 15px;
      margin: 10px 0;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .menu-item:hover {
      background-color: #facc15;
      color: black;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      background-color: #1e272e;
      color: white;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Code Section */
    .code-container {
      flex: 1;
      background-color: #2f3640;
      padding: 20px;
      border-right: 2px solid #444;
      overflow-y: auto;
      color: #dcdde1;
      font-family: 'Courier New', monospace;
      font-size: 16px;
    }

    .highlight {
      background-color: #44bd32;
      color: black;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Visualization Section */
    .visual-container {
      flex: 1;
      background-color: #273c75;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      text-align: center;
    }

    input {
      margin-top: 20px;
      padding: 12px 25px;
      border-radius: 5px;
      border: none;
      font-size: 18px;
      width: 60%;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #44bd32;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2ecc71;
    }

    #visualization {
      font-size: 30px;
      font-weight: bold;
      color: #44bd32;
    }

    /* Keyframe for string swap animation */
    @keyframes swapAnimation {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      50% {
        transform: translateX(20px);
        opacity: 0.6;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Palindromes Concept</h2>
    <ul class="menu">
      <li class="menu-item" onclick="location.href='../recur_theory.html'">Theory</li>
      <li class="menu-item" onclick="location.href='../Algorithms/recur_algo.html'">Algorithm</li>
      <li class="menu-item" onclick="location.href='../Flowcharts/recur_flow.html'">Flowchart</li>
      <li class="menu-item" onclick="location.href='../Quiz/recur_quiz.html'">Quiz</li>
    </ul>
  </div>

<div class="container">
  <!-- Code Section -->
  <div class="code-container">
    <pre id="code"></pre>
  </div>

  <!-- Visualization Section -->
  <div class="visual-container">
    <div id="visualization">Enter a string to check!</div>
    <input type="text" id="input-field" placeholder="Enter string or number" />
    <button onclick="checkPalindrome()">Check Palindrome</button>
  </div>
</div>

<script>
  let codeLines = [
`#include &lt;stdio.h&gt;`,
`#include &lt;string.h&gt;`,
``,
`int main() {`,
`    char str[100], reversed[100];`,
`    printf("Enter a string: ");`,
`    scanf("%s", str);`,
`    int len = strlen(str);`,
`    for(int i = 0; i < len; i++) {`,
`        reversed[i] = str[len - i - 1];`,
`    }`,
`    reversed[len] = '\\0';`,
`    `,
`    if (strcmp(str, reversed) == 0) {`,
`        printf("%s is a palindrome!\\n", str);`,
`    } else {`,
`        printf("%s is not a palindrome.\\n", str);`,
`    }`,
`    `,
`    return 0;`,
`}`
];

function renderCode(lines) {
  const codeContainer = document.getElementById("code");
  codeContainer.innerHTML = lines
    .map((line, index) => `<div class="code-line" data-line="${index}">${line}</div>`)
    .join("\n");
}

function highlightCodeLine(lineNumber) {
  const codeLinesDivs = document.querySelectorAll(".code-line");
  codeLinesDivs.forEach((lineDiv, index) => {
    if (index === lineNumber) {
      lineDiv.classList.add("highlight");
    } else {
      lineDiv.classList.remove("highlight");
    }
  });
}

function checkPalindrome() {
  const input = document.getElementById("input-field").value.trim();
  if (!input) {
    alert("Please enter a string or number.");
    return;
  }

  visualization.innerHTML = `You entered: ${input}`;
  
  renderCode(codeLines);  // Ensure the code stays rendered
  highlightCodeLine(6);   // Highlight the input

  setTimeout(() => {
    highlightCodeLine(9);  // Highlight the reversing section
    setTimeout(() => {
      let str = input;
      let reversed = str.split("").reverse().join("");
      let isPalindrome = (str === reversed);

      visualizeStringSwap(str, reversed, isPalindrome);

      setTimeout(() => {
        if (isPalindrome) {
          visualization.innerHTML = `${input} is a palindrome! 🎉`;
          highlightCodeLine(14);  // Highlight palindrome condition
        } else {
          visualization.innerHTML = `${input} is not a palindrome.`;
          highlightCodeLine(16);  // Highlight non-palindrome condition
        }
      }, 1000);
    }, 2000);
  }, 1000);
}

function visualizeStringSwap(str, reversed, isPalindrome) {
  let strArray = str.split("");
  let reversedArray = reversed.split("");
  let visualStr = document.createElement("div");
  visualStr.style.fontSize = "25px";
  visualStr.style.fontWeight = "bold";
  visualStr.innerHTML = `Original: ${strArray.join(" ")}<br>Reversed: ${reversedArray.join(" ")}`;
  visualStr.style.animation = "swapAnimation 1s forwards";
  visualization.appendChild(visualStr);
}

// Render the code snippet initially
renderCode(codeLines);
</script>

</body>
</html>
