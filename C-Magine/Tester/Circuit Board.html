<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Circuit Board Animation Demo</title>
  <style>
    /* Ensure the canvas fills the viewport */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="circuitCanvas"></canvas>
  <script>
    // Get the canvas and context
    const canvas = document.getElementById('circuitCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas to fill window and reinitialize grid
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initGrid();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Configuration
    const gridSpacing = 100; // Distance between nodes
    let nodes = [];          // Flat list of nodes for drawing circles
    let pulses = [];         // List of pulse animations

    // Initialize the grid and pulses using a 2D array approach.
    function initGrid() {
      nodes = [];
      pulses = [];
      
      const cols = Math.floor(canvas.width / gridSpacing);
      const rows = Math.floor(canvas.height / gridSpacing);
      const offsetX = (canvas.width - cols * gridSpacing) / 2;
      const offsetY = (canvas.height - rows * gridSpacing) / 2;
      
      // Create a 2D grid of nodes
      let grid = [];
      for (let i = 0; i <= cols; i++) {
        grid[i] = [];
        for (let j = 0; j <= rows; j++) {
          const x = i * gridSpacing + offsetX;
          const y = j * gridSpacing + offsetY;
          grid[i][j] = { x, y, col: i, row: j };
        }
      }
      
      // Flatten the 2D grid into a 1D nodes array for easier drawing.
      for (let i = 0; i <= cols; i++) {
        for (let j = 0; j <= rows; j++) {
          nodes.push(grid[i][j]);
        }
      }
      
      // Create pulses along horizontal and vertical connections.
      for (let i = 0; i <= cols; i++) {
        for (let j = 0; j <= rows; j++) {
          if (i < cols) {  // Create horizontal pulse (to the right neighbor)
            pulses.push({
              start: grid[i][j],
              end: grid[i + 1][j],
              t: Math.random(), // random start position along the line
              speed: 0.005 + Math.random() * 0.005
            });
          }
          if (j < rows) {  // Create vertical pulse (to the bottom neighbor)
            pulses.push({
              start: grid[i][j],
              end: grid[i][j + 1],
              t: Math.random(),
              speed: 0.005 + Math.random() * 0.005
            });
          }
        }
      }
    }

    // Draw the grid lines and nodes.
    function drawGrid() {
      // Set style for grid lines (adjust opacity if needed)
      ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
      ctx.lineWidth = 2;
      
      const cols = Math.floor(canvas.width / gridSpacing);
      const rows = Math.floor(canvas.height / gridSpacing);
      const offsetX = (canvas.width - cols * gridSpacing) / 2;
      const offsetY = (canvas.height - rows * gridSpacing) / 2;
      
      // Draw horizontal lines
      for (let j = 0; j <= rows; j++) {
        const y = j * gridSpacing + offsetY;
        ctx.beginPath();
        ctx.moveTo(offsetX, y);
        ctx.lineTo(canvas.width - offsetX, y);
        ctx.stroke();
      }
      
      // Draw vertical lines
      for (let i = 0; i <= cols; i++) {
        const x = i * gridSpacing + offsetX;
        ctx.beginPath();
        ctx.moveTo(x, offsetY);
        ctx.lineTo(x, canvas.height - offsetY);
        ctx.stroke();
      }
      
      // Draw each node as a small glowing circle
      nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
        ctx.fill();
      });
    }

    // Animate glowing pulses along the grid connections.
    function drawPulses() {
      pulses.forEach(pulse => {
        // Update pulse position along its connection.
        pulse.t += pulse.speed;
        if (pulse.t > 1) {
          pulse.t = 0;
        }
        const x = pulse.start.x + (pulse.end.x - pulse.start.x) * pulse.t;
        const y = pulse.start.y + (pulse.end.y - pulse.start.y) * pulse.t;
        
        // Draw the pulse as a glowing circle using a radial gradient.
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        let gradient = ctx.createRadialGradient(x, y, 0, x, y, 10);
        gradient.addColorStop(0, 'rgba(0,255,0,1)');
        gradient.addColorStop(1, 'rgba(0,255,0,0)');
        ctx.fillStyle = gradient;
        ctx.fill();
      });
    }

    // Main animation loop.
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawPulses();
      requestAnimationFrame(animate);
    }

    // Start the animation.
    initGrid();
    animate();
  </script>
</body>
</html>
