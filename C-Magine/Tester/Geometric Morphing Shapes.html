<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometric Morphing Shapes Background</title>
  <style>
    /* Remove default margins and ensure the canvas fills the viewport */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111; /* A dark background for contrast */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>

  <script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // Resize canvas to fill the window
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Function to create a morphing shape object
    function createShape(x, y, baseRadius, numVertices, color) {
      const shape = {
        x,
        y,
        baseRadius,
        numVertices,
        color,
        amplitudes: [],
        phases: [],
        frequency: 0.002 + Math.random() * 0.003 // Vary the speed of morphing slightly
      };
      // Set up per-vertex amplitude and phase for morphing
      for (let i = 0; i < numVertices; i++) {
        shape.amplitudes.push(10 + Math.random() * 20); // How much each vertex can deviate
        shape.phases.push(Math.random() * Math.PI * 2);
      }
      return shape;
    }

    // Create several shapes with random positions, sizes, and colors
    const shapes = [];
    const numShapes = 5;
    for (let i = 0; i < numShapes; i++) {
      shapes.push(createShape(
        Math.random() * window.innerWidth,           // Random x position
        Math.random() * window.innerHeight,            // Random y position
        50 + Math.random() * 100,                        // Base radius between 50 and 150
        6 + Math.floor(Math.random() * 3),               // 6 to 8 vertices
        'rgba(' +
          Math.floor(Math.random() * 255) + ',' +
          Math.floor(Math.random() * 255) + ',' +
          Math.floor(Math.random() * 255) + ',0.4)'        // Semi-transparent color
      ));
    }

    let time = 0;

    // Animation loop
    function animate() {
      time += 16; // Increment a time variable (in ms)
      
      // Clear the canvas
      ctx.clearRect(0, 0, width, height);
      
      // Draw each shape
      shapes.forEach(shape => {
        ctx.beginPath();
        for (let i = 0; i < shape.numVertices; i++) {
          // Calculate the angle for the current vertex
          const angle = (Math.PI * 2 / shape.numVertices) * i;
          // Use a sine function to modulate the radius, making the vertex shift in and out over time
          const offset = shape.amplitudes[i] * Math.sin(shape.frequency * time + shape.phases[i]);
          const currentRadius = shape.baseRadius + offset;
          // Calculate x and y for the vertex
          const vertexX = shape.x + currentRadius * Math.cos(angle);
          const vertexY = shape.y + currentRadius * Math.sin(angle);
          
          if (i === 0) {
            ctx.moveTo(vertexX, vertexY);
          } else {
            ctx.lineTo(vertexX, vertexY);
          }
        }
        ctx.closePath();
        ctx.fillStyle = shape.color;
        ctx.fill();
      });
      
      // Loop the animation
      requestAnimationFrame(animate);
    }

    // Start the animation loop
    animate();
  </script>
</body>
</html>
