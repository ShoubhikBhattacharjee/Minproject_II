<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C For Loop Visualization</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #1e272e;
      color: #fff;
      margin: 0;
      display: flex;
      justify-content: center;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 90%;
      justify-content: space-between;
    }

    .code-section {
      background-color: #2f3640;
      padding: 20px;
      width: 45%;
      overflow-y: auto;
      border-right: 4px solid #7f8fa6;
      height: 80vh;
    }

    .code-section pre {
      color: #dcdde1;
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .visualization-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      height: 80vh;
    }

    .iteration-box {
      background-color: #273c75;
      color: #fff;
      padding: 15px;
      border-radius: 5px;
      margin-top: 15px;
      font-size: 20px;
      width: 200px;
      text-align: center;
      opacity: 0;
      transform: translateY(50px);
      animation: fadeInUp 1s forwards;
    }

    button {
      background-color: #44bd32;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      margin-top: 20px;
    }

    button:hover {
      background-color: #2ecc71;
    }

    input {
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    #visualizationContainer {
      max-height: 500px;
      overflow-y: auto;
      width: 100%;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="code-section">
      <h2>For Loop Code</h2>
      <pre id="code">
#include <stdio.h>

int main() {
    int start = <span id="start-value">1</span>, end = <span id="end-value">5</span>, increment = <span id="increment-value">1</span>;
    
    // Loop from start to end
    for (int i = start; i <= end; i += increment) {
        printf("Iteration: %d, i = %d\\n", i, i);
    }

    return 0;
}
      </pre>

      <h3>Enter Values for the Loop</h3>
      <label for="start">Start Value:</label>
      <input type="number" id="start" value="1" />
      <br/>
      <label for="end">End Value:</label>
      <input type="number" id="end" value="5" />
      <br/>
      <label for="increment">Increment Value:</label>
      <input type="number" id="increment" value="1" />
      <br/>
      <button onclick="startLoop()">Start Loop</button>
    </div>

    <div class="visualization-section">
      <h2>C For Loop Visualization</h2>
      <div id="visualizationContainer"></div>
      <div id="loopEndMessage" style="display: none; color: #2ecc71; font-size: 20px;"></div>
    </div>
  </div>

  <script>
    // Function to update code dynamically
    function updateCode() {
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      const increment = document.getElementById('increment').value;

      document.getElementById('start-value').innerText = start;
      document.getElementById('end-value').innerText = end;
      document.getElementById('increment-value').innerText = increment;
    }

    // Function to start the loop
    async function startLoop() {
      updateCode();  // Update the code with dynamic values

      const start = parseInt(document.getElementById('start').value);
      const end = parseInt(document.getElementById('end').value);
      const increment = parseInt(document.getElementById('increment').value);

      let i = start;
      let iterationCount = 0;
      const visualizationContainer = document.getElementById('visualizationContainer');
      const loopEndMessage = document.getElementById('loopEndMessage');
      visualizationContainer.innerHTML = '';  // Clear previous iterations
      loopEndMessage.style.display = 'none'; // Hide end message initially

      let totalIterations = Math.floor((end - start) / increment) + 1; // Calculate total iterations
      let completedIterations = 0;  // Track completed iterations

      // Function to animate each iteration
      function createIterationBox(iterationCount, i) {
        return new Promise((resolve) => {
          const iterationBox = document.createElement('div');
          iterationBox.classList.add('iteration-box');
          iterationBox.textContent = `Iteration ${iterationCount}: i = ${i}`;

          // Add a delay before showing each iteration (animations)
          setTimeout(() => {
            visualizationContainer.appendChild(iterationBox);
            iterationBox.style.opacity = 1; // Make the box visible with smooth transition
            iterationBox.style.transform = 'translateY(0)'; // Bring it to normal position
            resolve();  // Resolve the promise after the animation
          }, 500 * iterationCount); // Delay for smooth visual animation
        });
      }

      // Looping through and displaying iterations
      for (i = start; i <= end; i += increment) {
        iterationCount++;
        await createIterationBox(iterationCount, i);  // Wait for the animation to finish before proceeding to next iteration
        completedIterations++;

        if (completedIterations === totalIterations) {
          // Only show the loop end message after the final animation
          setTimeout(() => {
            loopEndMessage.style.display = 'block';
            loopEndMessage.textContent = 'The loop has ended!';
          }, 1000); // Delay to ensure animations are finished
        }
      }
    }

  </script>

</body>
</html>
