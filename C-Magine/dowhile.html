<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do-While Loop Countdown Visualization</title>
  <style>
    /* Reset and basic layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', monospace;
      background-color: #1e272e;
      color: #dcdde1;
      display: flex;
      height: 100vh;
    }
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    /* Left: Code Section */
    .code-container {
      flex: 1;
      background-color: #2f3640;
      padding: 20px;
      border-right: 4px solid #44bd32;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 16px;
    }
    .highlight {
      background-color: #44bd32;
      color: #000;
      padding: 2px 4px;
      border-radius: 4px;
    }
    /* Right: Visualization Section */
    .visual-container {
      flex: 1;
      background-color: #273c75;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
    }
    h2 {
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: center;
      width: 80%;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      text-align: center;
    }
    button {
      margin-top: 15px;
      padding: 12px 25px;
      background-color: #44bd32;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2ecc71;
    }
    /* Countdown Animation: A circle that shrinks as the count decreases */
    .countdown-container {
      margin-top: 30px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: #44bd32;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 1s ease, opacity 1s ease;
    }
    .count-number {
      font-size: 36px;
      font-weight: bold;
      color: #000;
      position: absolute;
    }
    /* Fade-in for completion message */
    .complete-message {
      font-size: 24px;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Left: Code Section -->
  <div class="code-container" id="code-container">
    <!-- Dynamic code snippet will appear here -->
  </div>
  
  <!-- Right: Visualization Section -->
  <div class="visual-container">
    <h2>Do-While Loop Countdown</h2>
    <div class="input-group">
      <label for="start-value">Enter Starting Value:</label>
      <input type="number" id="start-value" placeholder="e.g., 10" />
    </div>
    <button onclick="startCountdown()">Start Countdown</button>
    
    <div class="countdown-container" id="countdown-container">
      <div class="count-number" id="count-number">0</div>
    </div>
    <div class="complete-message" id="complete-message">Countdown Complete!</div>
  </div>
</div>

<script>
  // Global variables
  let currentCount = 0;
  let simulationInterval;

  // Function to update the code snippet dynamically based on user input
  function updateCodeSnippet(startValue) {
    const codeStr =
`#include <stdio.h>
#include <stdlib.h>

int main() {
    int count;
    printf("Enter a number: ");
    scanf("%d", &count);  // count = ${startValue}

    do {
        printf("Count: %d\\n", count);  // Print current count
        count--;                        // Decrement count
    } while(count > 0);

    printf("Countdown Complete!\\n");
    return 0;
}`;
    document.getElementById("code-container").innerText = codeStr;
  }

  // Helper function to highlight a specific line (1-indexed)
  function highlightCodeLine(lineNumber) {
    const codeContainer = document.getElementById("code-container");
    const codeLines = codeContainer.innerText.split("\n");
    codeContainer.innerHTML = codeLines
      .map((line, index) =>
        index === lineNumber - 1 ? `<span class="highlight">${line}</span>` : line
      )
      .join("\n");
  }

  // Helper delay function
  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Main simulation function for the do-while countdown
  async function startCountdown() {
    const startValueInput = document.getElementById("start-value").value.trim();
    if (!startValueInput) {
      alert("Please enter a starting value.");
      return;
    }
    const startValue = parseInt(startValueInput);
    currentCount = startValue;
    
    // Update the dynamic code snippet with the input value
    updateCodeSnippet(startValue);
    // Reset countdown visualization
    document.getElementById("count-number").innerText = currentCount;
    document.getElementById("countdown-container").style.transform = "scale(1)";
    document.getElementById("countdown-container").style.opacity = 1;
    document.getElementById("complete-message").style.opacity = 0;

    // Start the simulation using a do-while loop style (simulated with setInterval)
    // We simulate the "do" block first:
    highlightCodeLine(7); // Highlight the printf line inside do-while
    await delay(1000);
    
    simulationInterval = setInterval(async () => {
      // Visual update: update the countdown display and animate the circle shrinking slightly
      document.getElementById("count-number").innerText = currentCount;
      // Animate the circle: scale proportional to currentCount/startValue
      let scaleValue = currentCount / startValue;
      document.getElementById("countdown-container").style.transform = "scale(" + (0.5 + 0.5 * scaleValue) + ")";
      
      // Simulate the loop iteration: print the current count (highlight code line)
      highlightCodeLine(7); // (Inside do-while loop's print)
      console.log("Count: " + currentCount);
      
      currentCount--;  // Decrement count
      
      // After the iteration, highlight the decrement line (assume line 8)
      highlightCodeLine(8);
      
      // Check if condition is still true (simulate do-while check)
      if (currentCount <= 0) {
        clearInterval(simulationInterval);
        // Highlight the final print line (assume line 10)
        highlightCodeLine(10);
        // Animate fading out the countdown circle
        document.getElementById("countdown-container").style.opacity = 0;
        // Show completion message
        document.getElementById("complete-message").style.opacity = 1;
      }
      
      await delay(1000);
    }, 1000);
  }
</script>

</body>
</html>
