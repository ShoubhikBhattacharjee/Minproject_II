<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do-While Loop Countdown Visualization</title>
  <style>
    /* Reset and basic layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .sidebar {
      width: 250px;
      background-color: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      color: #facc15;
      text-align: center;
      margin-bottom: 20px;
    }

    .menu {
      list-style: none;
    }

    .menu-item {
      background-color: #334155;
      padding: 15px;
      margin: 10px 0;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .menu-item:hover {
      background-color: #facc15;
      color: black;
    }
    body {
      font-family: 'Courier New', monospace;
      background-color: #1e272e;
      color: #dcdde1;
      display: flex;
      height: 100vh;
    }
    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    /* Left: Code Section */
    .code-container {
      flex: 1;
      background-color: #2f3640;
      padding: 20px;
      border-right: 4px solid #44bd32;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 16px;
    }
    .highlight {
      background-color: #44bd32;
      color: #000;
      padding: 2px 4px;
      border-radius: 4px;
    }
    /* Right: Visualization Section */
    .visual-container {
      flex: 1;
      background-color: #273c75;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
    }
    h2 {
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: center;
      width: 80%;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      text-align: center;
    }
    button {
      margin-top: 15px;
      padding: 12px 25px;
      background-color: #44bd32;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2ecc71;
    }
    /* Countdown Animation: A circle that shrinks as the count decreases */
    .countdown-container {
      margin-top: 30px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: #44bd32;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 1s ease, opacity 1s ease;
    }
    .count-number {
      font-size: 36px;
      font-weight: bold;
      color: #000;
      position: absolute;
    }
    /* Fade-in for completion message */
    .complete-message {
      font-size: 24px;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Do-While Loop</h2>
    <ul class="menu">
      <li class="menu-item" onclick="location.href='../recur_theory.html'">Theory</li>
      <li class="menu-item" onclick="location.href='../Algorithms/recur_algo.html'">Algorithm</li>
      <li class="menu-item" onclick="location.href='../Flowcharts/recur_flow.html'">Flowchart</li>
      <li class="menu-item" onclick="location.href='Quiz/dowhile_quiz.html'">Quiz</li>
    </ul>
  </div>
<div class="container">
  <!-- Left: Code Section -->
  <div class="code-container" id="code-container">
    <!-- Dynamic code snippet will appear here -->
  </div>
  
  <!-- Right: Visualization Section -->
  <div class="visual-container">
    <h2>Do-While Loop Countdown</h2>
    <div class="input-group">
      <label for="start-value">Enter Starting Value:</label>
      <input type="number" id="start-value" placeholder="e.g., 10" />
    </div>
    <button onclick="startCountdown()">Start Countdown</button>
    
    <div class="countdown-container" id="countdown-container">
      <div class="count-number" id="count-number">0</div>
    </div>
    <div class="complete-message" id="complete-message">Countdown Complete!</div>
  </div>
</div>

<script>
  // Global variables
  let currentCount = 0;
  let simulationInterval;

  // Function to update the code snippet dynamically based on user input
  function updateCodeSnippet(startValue) {
  const codeStr = [
    `#include &lt;stdio.h&gt;`,
    `#include &lt;stdlib.h&gt;`,
    ``,
    `int main() {`,
    `    int count;`,
    `    printf("Enter a number: ");`,
    `    scanf("%d", &count);  // count = ${startValue}`,
    ``,
    `    do {`,
    `        printf("Count: %d\\n", count);  // Print current count`,
    `        count--;                        // Decrement count`,
    `    } while(count > 0);`,
    ``,
    `    printf("Countdown Complete!\\n");`,
    `    return 0;`,
    `}`
  ];

  const formattedCode = codeStr.map((line, index) =>
    `<div class="code-line" data-line="${index + 1}">${line}</div>`
  ).join('');

  document.getElementById("code-container").innerHTML = formattedCode;
}

  // Helper function to highlight multiple lines
  function highlightCodeLines(lines) {
    // Clear existing highlights
    document.querySelectorAll(".code-line").forEach((line) => {
      line.classList.remove("highlight");
    });

    // Highlight specified lines
    lines.forEach((lineNumber) => {
      const lineElement = document.querySelector(`.code-line[data-line="${lineNumber}"]`);
      if (lineElement) {
        lineElement.classList.add("highlight");
      }
    });
  }

  // Main simulation function for the do-while countdown
  async function startCountdown() {
    const startValueInput = document.getElementById("start-value").value.trim();
    if (!startValueInput) {
      alert("Please enter a starting value.");
      return;
    }
    const startValue = parseInt(startValueInput);
    currentCount = startValue;

    // Update the dynamic code snippet with the input value
    updateCodeSnippet(startValue);

    // Reset countdown visualization
    document.getElementById("count-number").innerText = currentCount;
    document.getElementById("countdown-container").style.transform = "scale(1)";
    document.getElementById("countdown-container").style.opacity = 1;
    document.getElementById("complete-message").style.opacity = 0;

    // Start the simulation using a do-while loop style
    highlightCodeLines([7]); // Highlight scanning values
    await delay(1000);

    simulationInterval = setInterval(() => {
      // Visual update: update the countdown display
      document.getElementById("count-number").innerText = currentCount;

      // Animate the circle: scale proportional to currentCount/startValue
      let scaleValue = currentCount / startValue;
      document.getElementById("countdown-container").style.transform = "scale(" + (0.5 + 0.5 * scaleValue) + ")";

      // Highlight the print and decrement lines simultaneously
      highlightCodeLines([10, 11]);
      console.log("Count: " + currentCount);

      currentCount--;  // Decrement count

      // Check if condition is still true (simulate do-while check)
      if (currentCount <= 0) {
        clearInterval(simulationInterval);
        highlightCodeLines([14]); // Highlight the final print line
        document.getElementById("countdown-container").style.opacity = 0;
        document.getElementById("complete-message").style.opacity = 1;
      }
    }, 1000);
  }

  // Helper delay function
  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
</body>
</html>
