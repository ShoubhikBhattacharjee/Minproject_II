<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>College Student Registration</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
        }
        .form-control {
            border-radius: 20px;
        }
        .login-text {
            text-align: center;
            margin-top: 15px;
        }
        .login-text a {
            color: #2575fc;
            text-decoration: none;
            font-weight: bold;
        }
        .login-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h3 class="text-center text-primary fw-bold">Student Registration</h3>
    <form>
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" placeholder="Enter your first name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Surname</label>
            <input type="text" class="form-control" placeholder="Enter your surname" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select class="form-control" required>
                <option value="" selected disabled>Select Department</option>
                <option>Computer Engineering</option>
                <option>Electronics & Telecommunications</option>
                <option>Information Technology</option>
                <option>Artificial Intelligence & Data Science</option>
            </select>
        </div>
        
        <!-- Password Input (Uses Bootstrap's built-in eye icon) -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <!-- Confirm Password Input -->
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Confirm password" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100">Register</button>
        
        <!-- Already have an account? Login -->
        <div class="login-text">
            <p>Already have an account? <a href="#">Login</a></p>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
