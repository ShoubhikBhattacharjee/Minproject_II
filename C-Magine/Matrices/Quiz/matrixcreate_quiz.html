  <body>

    <div class="content-section">
      <div class="container">
        <h1>Creating 2D Array Matrix in C Quiz</h1>
        <div id="quiz-container"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
    <script>
      const quizData = [
      {
      question: "How do you declare a 2D array in C?",
      options: ["int arr[][];", "int arr[10][10];", "int arr[10,10];", "array<int> arr[10][10];"],
      correct: 1
    },
    {
      question: "How is memory allocated for a 2D array in C?",
      options: ["Not allocated", "Column-major order", "Random order", "Row-major order"],
      correct: 3
    },
    {
      question: "How can you dynamically allocate memory for a 2D array?",
      options: ["Using malloc()", "Using calloc()", "Using nested malloc() calls", "All of the above"],
      correct: 3
    },
    {
      question: "Which loop structure is typically used to input a 2D array?",
      options: ["Single loop", "Double nested loop", "While loop", "Do-while loop"],
      correct: 1
    },
    {
      question: "How do you access an element at row i and column j in a 2D array?",
      options: ["arr[i][j]", "arr[j][i]", "arr(i,j)", "arr[i,j]"],
      correct: 0
    },
    {
      question: "Which function is best suited for printing a 2D array?",
      options: ["printf()", "putchar()", "puts()", "All of the above"],
      correct: 0
    },
    {
      question: "How do you deallocate a dynamically allocated 2D array?",
      options: ["free(arr)", "Using nested free() calls", "delete arr", "None of the above"],
      correct: 1
    },
    {
      question: "What is the correct way to initialize a 2D array?",
      options: [
        "int arr[2][2] = {1, 2, 3, 4};",
        "int arr[2][2] = {{1, 2}, {3, 4}};",
        "int arr[][] = {{1, 2}, {3, 4}};",
        "int arr[2,2] = {1, 2, 3, 4};"
      ],
      correct: 1
    },
    {
      question: "Which of the following statements is true for a 2D array?",
      options: [
        "A 2D array can be indexed using a single loop",
        "A 2D array always has equal number of rows and columns",
        "Elements of a 2D array are stored in contiguous memory locations",
        "All elements must be initialized to zero"
      ],
      correct: 2
    },
    {
      question: "What happens if you access an out-of-bounds index in a 2D array?",
      options: [
        "The program runs normally",
        "The program crashes or gives unpredictable results",
        "A compile-time error occurs",
        "The value is automatically set to 0"
      ],
      correct: 1
    }
      ];

      const selectedQuestions = quizData
  .sort(() => Math.random() - 0.5) // Shuffle questions
  .slice(0, 5); // Pick the first 5 after shuffling

      let answeredQuestions = 0;
      let correctAnswers = 0;

      function loadQuiz() {
        const quizContainer = document.getElementById("quiz-container");
        quizContainer.innerHTML = "";

        selectedQuestions.forEach((item, index) => {
          const questionElem = document.createElement("div");
          questionElem.classList.add("quiz-question");
          questionElem.innerHTML = `<h3>${index + 1}. ${item.question}</h3>`;

          item.options.forEach((option, optionIndex) => {
            const optionElem = document.createElement("div");
            optionElem.classList.add("quiz-option");
            optionElem.innerHTML = `${option} <span class="icon"></span>`;

            optionElem.addEventListener("click", () => {
              handleOptionClick(optionElem, item.correct, optionIndex, item, index);
            });
            questionElem.appendChild(optionElem);
          });
          quizContainer.appendChild(questionElem);
        });
      }

      function handleOptionClick(optionElem, correctIndex, selectedIndex, item, questionIndex) {
        const options = optionElem.parentElement.querySelectorAll(".quiz-option");
        options.forEach((option, index) => {
          option.classList.remove("correct", "incorrect");
          const icon = option.querySelector(".icon");
          icon.innerHTML = "";
        });

        if (selectedIndex === correctIndex) {
          optionElem.classList.add("correct");
          optionElem.querySelector(".icon").innerHTML = "✔";
          correctAnswers++;
        } else {
          optionElem.classList.add("incorrect");
          optionElem.querySelector(".icon").innerHTML = "✘";
          // Highlight the correct option
          options[correctIndex].classList.add("correct");
        }

        answeredQuestions++;

        // Disable further selection for the current question
        options.forEach((option) => {
          option.style.pointerEvents = "none";
        });

        if (answeredQuestions === selectedQuestions.length) {
          showFeedback();
        }
      }

      function showFeedback() {
        const feedbackElem = document.getElementById("feedback");
        const scorePercentage = (correctAnswers / selectedQuestions.length) * 100;
        let feedbackMessage;

        if (scorePercentage === 100) {
          feedbackMessage = "Excellent! You got all answers correct!";
        } else if (scorePercentage >= 75) {
          feedbackMessage = "Great job! You have a strong understanding of Using a 2D array to create a matrix in C.";
        } else if (scorePercentage >= 50) {
          feedbackMessage = "Good effort! You might want to review some concepts.";
        } else {
          feedbackMessage = "Keep practicing! 2D arrays in C can be tricky at first.";
        }

        feedbackElem.innerHTML = `You scored ${correctAnswers} out of ${selectedQuestions.length}. ${feedbackMessage}`;
      }

      loadQuiz();
    </script>
  </body>
