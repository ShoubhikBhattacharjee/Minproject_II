    <div class="content-section">
      <div class="container">
        <h1>Functions in C Quiz</h1>
        <div id="quiz-container"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
    <script>
      const quizData = [
        {
          question: "What is the correct syntax for defining a function in C?",
          options: [
            "void function_name();",
            "return_type function_name(parameters) { /* body */ }",
            "function_name() { /* body */ }",
            "int function_name();",
          ],
          correct: 1,
        },
        {
          question:
            "What is the return type of a function that does not return any value?",
          options: ["int", "void", "float", "char"],
          correct: 1,
        },
        {
          question:
            "Which of the following is the correct way to declare a function that adds two numbers?",
          options: [
            "int add(int a, int b);",
            "void add(int a, int b);",
            "float add(int a, int b);",
            "char add(int a, int b);",
          ],
          correct: 0,
        },
        {
          question:
            "What is the correct way to call a function add(int a, int b) in C?",
          options: [
            "add(a, b);",
            "int add(a, b);",
            "sum(a, b);",
            "add(int a, int b);",
          ],
          correct: 0,
        },
        {
          question:
            "Where should function prototypes be placed in a C program?",
          options: [
            "Inside main()",
            "After main()",
            "Before main()",
            "Anywhere in the program",
          ],
          correct: 2,
        },
        {
          question:
            "What will happen if a function is called without being declared in C?",
          options: [
            "The program will execute successfully",
            "The compiler will throw an error",
            "The function will be treated as void",
            "The program will execute but with unpredictable results",
          ],
          correct: 1,
        },
        {
          question: "What is function overloading in C?",
          options: [
            "Defining multiple functions with the same name but different parameters",
            "Using too many functions in a program",
            "Calling a function multiple times",
            "A function returning multiple values",
          ],
          correct: 0,
        },
        {
          question:
            "Which of the following statements about functions in C is true?",
          options: [
            "A function in C can return multiple values.",
            "Every function in C must have a return statement.",
            "A function must always have parameters.",
            "A function can be called multiple times in a program.",
          ],
          correct: 3,
        },
        {
          question:
            "What is the default return type of a function in C if not specified?",
          options: ["void", "int", "char", "float"],
          correct: 1,
        },
        {
          question:
            "What is the correct way to define a function that adds two numbers and returns the result?",
          options: [
            "int add(int a, int b) { return a + b; }",
            "void add(int a, int b) { return a + b; }",
            "int add(int a, int b) { printf('%d', a + b); }",
            "add(int a, int b) { return a + b; }",
          ],
          correct: 0,
        },
      ];

      document.addEventListener("DOMContentLoaded", initializeQuiz(quizData));
    </script>
  </body>
